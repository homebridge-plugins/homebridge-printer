<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Printers</title>
  <link rel="stylesheet" href="dashboard.css">
  <style>
    html, body { margin: 0; min-height: 100%; background: #e3e3ee; }
    html.dark, html.dark body { background: #1d1d27; }
    .page { max-width: 1280px; margin: 0 auto; padding: 24px 16px; }
    .page .hp-dashboard { background: transparent; }
  </style>
</head>
<body>
  <main class="page"><div id="app"></div></main>
  <script src="dashboard.js"></script>
  <script>
    (function () {
      var app = document.getElementById('app');
      var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
      function theme() {
        var on = dark && dark.matches;
        app.classList.toggle('hp-dark', !!on);
        document.documentElement.classList.toggle('dark', !!on);
      }
      theme();
      if (dark && dark.addEventListener) dark.addEventListener('change', theme);
      HPDashboard.mount(app, HPDashboard.httpSource(''));
    })();
  </script>
</body>
</html>
